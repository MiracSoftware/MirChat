name: mirchat
description: "MirChat - Aile Haberleşme Uygulaması"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase Paketleri
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  cloud_firestore: ^5.0.1

  # Bildirim, Ses ve İzin Paketleri
  flutter_local_notifications: ^17.1.2
  audioplayers: ^6.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Ses dosyaları için asset yolu
  assets:
    - assets/sounds/